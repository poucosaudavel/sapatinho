<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a22">
<title>Organizador · Sapatinho</title>
<meta name="robots" content="noindex, nofollow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sapatinho">
<meta property="og:locale" content="pt_PT">
<meta property="og:image" content="https://sapatinho-natal.pt/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sapatinho, o amigo secreto da família sem papelinhos">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:title" content="Link de organizador · Sapatinho">
<meta property="og:description" content="Lista de convites do teu amigo secreto.">
<meta property="og:url" content="https://sapatinho-natal.pt/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
.page{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px;padding-block:16px 0}
.page h1{font-size:clamp(2rem,5vw,2.8rem);line-height:1.05;margin-top:10px}
.panel{padding:30px 28px 26px;display:flex;flex-direction:column;gap:14px}
.warn{background:var(--paper-2);border-radius:4px;padding:12px 14px;font-size:.92rem;color:var(--ink)}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.res b{font-family:var(--display);font-weight:400;font-size:1.25rem;color:var(--ink)}
.res small{display:block;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbtn{font:600 .85rem var(--body);padding:10px 12px;border-radius:4px;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);cursor:pointer;white-space:nowrap}
.sbtn:hover{border-color:var(--ink)}
.sbtn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:480px){.panel{padding:26px 18px 22px}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <header class="top">
    <a class="logo" href="/"><img src="/favicon.svg" alt=""><b>Sapatinho<span>.</span></b></a>
  </header>
  <main class="page">
    <div>
      <div class="eyebrow">Link de organizador</div>
      <h1 id="title">O teu sorteio</h1>
    </div>
    <section class="card panel" id="box">
      <p class="lead">A carregar…</p>
    </section>
  </main>
  <footer class="foot">
    <span>© 2026 Sapatinho · sapatinho-natal.pt</span>
    <span>Ajuda: ajuda@sapatinho-natal.pt</span>
  </footer>
</div>
<script src="/snow.js"></script>
<script src="/sapatinho.js"></script>
<script>
(function(){
  var box = document.getElementById("box");
  var o = Sap.decode((location.hash || "").slice(1), true);
  if (!o || o.v !== "org" || !Array.isArray(o.links)){
    box.innerHTML = '<h2 style="font-size:1.6rem;color:var(--ink)">Link inválido</h2><p class="lead">Confirma que copiaste o link de organizador completo.</p>';
    return;
  }
  document.getElementById("title").textContent = o.g;
  box.innerHTML =
    '<div class="warn">Se alguém perdeu o convite, copia o link dessa pessoa e envia-lho por email. Não abras os links dos outros, ou ficas a saber quem lhes saiu.</div>' +
    o.links.map(function(x,i){
      return '<div class="res"><div style="min-width:0"><b>'+Sap.esc(x.n)+'</b><small>'+Sap.esc(x.e || "")+'</small></div>'+
        '<button type="button" class="sbtn" data-i="'+i+'">Copiar link de '+Sap.esc(x.n)+'</button></div>';
    }).join("");
  box.addEventListener("click", function(ev){
    var b = ev.target.closest(".sbtn"); if (!b) return;
    Sap.copy(o.links[+b.dataset.i].link, b);
  });
})();
</script>
</body>
</html>
