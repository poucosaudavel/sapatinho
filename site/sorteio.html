<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a22">
<title>O teu sorteio · Sapatinho</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sapatinho">
<meta property="og:locale" content="pt_PT">
<meta property="og:image" content="https://sapatinho-natal.pt/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Sapatinho, o amigo secreto da família sem papelinhos">
<meta name="twitter:card" content="summary_large_image">
<meta property="og:title" content="O teu sorteio do amigo secreto">
<meta property="og:description" content="Abre para descobrires quem te saiu. Este link é só teu.">
<meta property="og:url" content="https://sapatinho-natal.pt/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/styles.css?v=20261029b">
<style>
.stage{display:flex;flex-direction:column;align-items:center;padding-block:24px 0}
.draw{width:100%;max-width:440px;padding:32px 28px 28px;display:flex;flex-direction:column;gap:20px}
.draw h1{font-size:2.1rem;line-height:1.1;margin-top:4px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts div{padding:12px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.facts div+div{border-left:1px solid var(--line)}
.facts b{font-family:var(--display);font-weight:400;font-size:1.35rem;font-variant-numeric:tabular-nums;color:var(--ink)}
.facts small{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.reel{position:relative;height:96px;overflow:hidden;border-radius:4px;background:var(--night);color:var(--paper)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:28px;z-index:2;pointer-events:none}
.reel::before{top:0;background:linear-gradient(var(--night),rgba(15,42,34,0))}
.reel::after{bottom:0;background:linear-gradient(rgba(15,42,34,0),var(--night))}
.reel .win{position:absolute;left:12px;right:12px;top:50%;height:52px;transform:translateY(-50%);border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);z-index:1;pointer-events:none}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.strip div{height:52px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.7rem}
.strip .q{color:var(--gold);font-size:2.2rem}
.reel.idle .strip div:not(.q){visibility:hidden}
.result{text-align:center}
.result .who{font-family:var(--display);font-size:3rem;line-height:1.05;color:var(--ember)}
.note{font-size:.88rem;color:var(--muted);text-align:center}
.secret{display:flex;gap:10px;align-items:flex-start;background:var(--paper-2);border-radius:4px;padding:12px 14px;font-size:.88rem;color:var(--ink)}
.secret svg{flex:none;margin-top:2px}
.back{margin-top:22px;font-size:.88rem;color:var(--soft)}
.gifts{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:10px}
.gifts h2{font-size:1.35rem;line-height:1.2;text-align:center;margin:0 0 4px}
.gifts .btn{text-decoration:none}
.again{border-top:1px solid var(--line);padding-top:16px}
.remind{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:10px}
.remind h2{font-size:1.2rem;line-height:1.2;text-align:center;margin:0}
.remind .btn{text-decoration:none}
@media (max-width:420px){.draw{padding:28px 20px 22px}.draw h1{font-size:1.8rem}.result .who{font-size:2.5rem}}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="top">
    <a class="logo" href="/"><img src="/favicon.svg" alt=""><b>Sapatinho<span>.</span></b></a>
  </header>

  <main class="stage">
    <div class="card draw" id="app" aria-live="polite">
      <div>
        <div class="eyebrow">A carregar</div>
        <h1>A abrir o teu sorteio…</h1>
      </div>
    </div>
    <a class="back" href="/">sapatinho-natal.pt</a>
  </main>

  <footer class="foot">
    <span>© 2026 Sapatinho</span>
    <span>Ajuda: <!--email_off--><a href="mailto:ajuda@sapatinho-natal.pt">ajuda@sapatinho-natal.pt</a><!--/email_off--></span>
  </footer>
</div>

<script src="/snow.js"></script>
<script src="/sapatinho.js?v=20261030"></script>
<script>
/* Each link made on /criar (/r/<payload>) carries its own signed data. */
var app = document.getElementById("app");
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var esc = Sap.esc;

function facts(o){
  var third = o.d ? '<div><b>'+esc(Sap.shortDate(o.d))+'</b><small>Troca</small></div>' : '<div><b>1</b><small>Prenda</small></div>';
  return '<div class="facts"><div><b>'+o.p.length+'</b><small>Participantes</small></div><div><b>'+(o.l ? esc(o.l)+' €' : '—')+'</b><small>Limite</small></div>'+third+'</div>';
}
var lock = '<div class="secret"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Não contes a ninguém. Podes voltar a este link sempre que quiseres confirmar quem te saiu.</span></div>';
function groupLine(o){ return o.g ? '<div class="eyebrow" style="color:var(--ember)">'+esc(o.g)+'</div>' : ''; }

function showResult(o, mailing){
  document.title = "O teu amigo secreto · Sapatinho";
  app.innerHTML = groupLine(o) +
    '<div><div class="eyebrow">'+esc(o.n)+', o teu amigo secreto é</div></div>'+
    '<div class="result"><div class="who">'+esc(o.t)+'</div></div>'+
    facts(o) + lock +
    '<p class="note">'+(o.l ? 'Escolhe uma prenda até '+esc(o.l)+' €. ' : '')+(o.d ? 'A troca é a '+esc(Sap.fmtDate(o.d))+'. ' : '')+'Bom Natal!</p>'+
    (mailing ? '<p class="note" id="mailnote">A enviar-te um email com o nome…</p>' : '');
  // Ideias de prenda e convite: construídos com createElement/textContent, nunca com HTML a partir do link.
  app.appendChild(giftBlock(o.l));
  app.appendChild(remindBlock(o));
  app.appendChild(againLine());
}
function validLimit(l){ return (typeof l === "number" && isFinite(l) && Math.floor(l) === l && l > 0) ? l : 0; }
/* Página de prendas para o limite do grupo. A faixa nunca passa do limite (12 € -> até 10 €), como no email;
   abaixo de 5 € vai para «até 5 €»; acima de 20 € ou sem limite, para o guia geral. Só números, nunca nomes.
   Cada botão passa por um endereço de contagem fixo /ir/prendas/<página>/ (gerado em tools/seo/build.py, sem parâmetros). */
function giftLinks(l){
  var n = validLimit(l), out = [];
  if (n && n < 10) {
    out.push(["/ir/prendas/ate-5/", "Prendas até 5 €"]);
    if (n <= 5) out.push(["/ir/prendas/engracadas/", "Prendas engraçadas"]);
  } else if (n && n <= 20) {
    var c = n < 15 ? 10 : n < 20 ? 15 : 20;
    out.push(["/ir/prendas/ate-" + c + "/", "Prendas até " + c + " €"]);
  } else {
    out.push(["/ir/prendas/ideias/", "Ideias de prendas por preço"]);
  }
  out.push(["/ir/prendas/ultima-hora/", "Prendas de última hora"]);
  return out;
}
function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
function giftBlock(l){
  var n = validLimit(l), box = el("div", "gifts");
  box.appendChild(el("h2", "", "Já sabes a quem vais dar. " + (n ? "Precisas de ideias até " + String(n) + " €?" : "Precisas de ideias de prendas?")));
  giftLinks(l).forEach(function(p, i){
    var a = el("a", i === 0 ? "btn wide" : "btn ghost wide", p[1]);
    a.href = p[0];
    box.appendChild(a);
  });
  return box;
}
function againLine(){
  var p = el("p", "note again", "Queres fazer um amigo secreto com outro grupo? É grátis e demora 2 minutos. ");
  var a = el("a", "", "Criar outro sorteio");
  a.href = "/ir/sorteio/";
  a.rel = "noreferrer"; // o endereço do /r leva o payload: não o passar à página de contagem
  p.appendChild(a);
  return p;
}

/* «Lembra-me de comprar a prenda»: evento de calendário gerado aqui no navegador.
   O texto do evento é fixo: nunca leva o nome de quem saiu, o teu nome, o grupo nem o link do convite
   (o link tem os nomes, só ofuscados). Só entram o limite (número) e a data da troca (já validados por Sap.safe). */
var CAL_IR = "https://sapatinho-natal.pt/ir/calendario/";
var CAL_TITLE = "Comprar a prenda do amigo secreto";
function ymd(dt){ return dt.getUTCFullYear() + ("0"+(dt.getUTCMonth()+1)).slice(-2) + ("0"+dt.getUTCDate()).slice(-2); }
function todayUTC(){ var n = new Date(); return new Date(Date.UTC(n.getFullYear(), n.getMonth(), n.getDate())); }
/* Dia do lembrete: 3 dias antes da troca (nunca antes de amanhã); sem data, daqui a 3 dias. Troca já passada: sem lembrete. */
function remindDay(d){
  var t = todayUTC(), DAY = 86400000, tomorrow = new Date(t.getTime() + DAY);
  if (!d) return new Date(t.getTime() + 3*DAY);
  var p = d.split("-"), x = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  if (isNaN(x.getTime()) || x.getTime() <= t.getTime()) return null;
  var r = new Date(x.getTime() - 3*DAY);
  return r.getTime() < tomorrow.getTime() ? tomorrow : r;
}
function calDetails(o){
  var n = validLimit(o.l), parts = [];
  if (n) parts.push("Limite: " + String(n) + " €.");
  if (o.d) parts.push("A troca é a " + Sap.fmtDate(o.d) + ".");
  parts.push("Para veres de novo quem te saiu, abre o link do teu convite (está no teu email).");
  parts.push("Ideias de prendas: " + CAL_IR);
  return parts.join("\n");
}
function icsText(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function icsFile(day, details){
  var end = new Date(day.getTime() + 86400000);
  var stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  var uid = Date.now().toString(36) + Math.random().toString(36).slice(2) + "@sapatinho-natal.pt";
  return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Sapatinho//Lembrete//PT","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT","UID:"+uid,"DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+ymd(day),"DTEND;VALUE=DATE:"+ymd(end),
    "SUMMARY:"+icsText(CAL_TITLE),"DESCRIPTION:"+icsText(details),"URL:"+CAL_IR,"TRANSP:TRANSPARENT",
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsText(CAL_TITLE),"TRIGGER:PT10H","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].map(icsFold).join("\r\n") + "\r\n";
}
/* Linhas do .ics com no máximo 75 bytes (RFC 5545): parte-se de 60 em 60 caracteres. */
function icsFold(line){ var out = []; while (line.length > 60) { out.push(line.slice(0, 60)); line = line.slice(60); } out.push(line); return out.join("\r\n "); }
function remindBlock(o){
  var box = el("div", "remind"), day = remindDay(o.d);
  if (!day) return box;
  var details = calDetails(o);
  box.appendChild(el("h2", "", "Lembra-me de comprar a prenda"));
  box.appendChild(el("p", "note", "Fica um lembrete no teu calendário a " + Sap.fmtDate(ymd(day).replace(/(\d{4})(\d{2})(\d{2})/, "$1-$2-$3")) + ". Não leva o nome de quem te saiu."));
  var g = el("a", "btn ghost wide", "Google Calendar");
  g.href = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
    "&text=" + encodeURIComponent(CAL_TITLE) +
    "&dates=" + ymd(day) + "/" + ymd(new Date(day.getTime() + 86400000)) +
    "&details=" + encodeURIComponent(details);
  g.target = "_blank"; g.rel = "noopener noreferrer";
  box.appendChild(g);
  var b = el("button", "btn ghost wide", "Outro calendário (iPhone, Outlook)");
  b.type = "button";
  b.addEventListener("click", function(){
    try {
      var url = URL.createObjectURL(new Blob([icsFile(day, details)], { type: "text/calendar;charset=utf-8" }));
      var a = document.createElement("a");
      a.href = url; a.download = "lembrete-prenda.ics";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
    } catch (e) { b.textContent = "Não foi possível criar o lembrete"; b.disabled = true; }
  });
  box.appendChild(b);
  return box;
}

function showDraw(o, key, code){
  var pool = o.p.filter(function(n){return n !== o.n});
  var seq = [];
  for (var i=0;i<6;i++){ var s = pool.slice().sort(function(){return Math.random()-.5}); seq = seq.concat(s); }
  seq.push(o.t);
  seq.unshift("?");
  app.innerHTML = groupLine(o) +
    '<div><div class="eyebrow">Olá, '+esc(o.n)+'</div><h1>Está na hora de sortear o teu amigo secreto</h1></div>'+
    facts(o) +
    '<div class="reel idle" id="reel" aria-hidden="true"><div class="win"></div><div class="strip" id="strip">'+seq.map(function(n,i){return i===0 ? '<div class="q">?</div>' : '<div>'+esc(n)+'</div>'}).join("")+'</div></div>'+
    '<button class="btn wide" id="go" type="button">Sortear o meu amigo secreto</button>'+
    '<p class="note">O sorteio só pode ser feito uma vez.</p>';
  var strip = document.getElementById("strip"), reel = document.getElementById("reel");
  var row = 52, offset = (96-row)/2;
  strip.style.transform = "translateY("+offset+"px)";
  document.getElementById("go").addEventListener("click", function(e){
    var b = e.currentTarget; b.disabled = true; b.textContent = "A sortear…";
    reel.classList.remove("idle");
    var end = -((seq.length-1)*row) + offset;
    var dur = reduce ? 600 : 4200;
    strip.style.transition = "transform "+dur+"ms cubic-bezier(.12,.72,.18,1)";
    requestAnimationFrame(function(){ strip.style.transform = "translateY("+end+"px)"; });
    setTimeout(function(){ Sap.setS(key,"1"); showResult(o, !!((o.x || o.e) && code)); if ((o.x || o.e) && code) sendConfirm(code); }, dur + 700);
  });
}

function sendConfirm(code){
  var note = function(t){ var n = document.getElementById("mailnote"); if (n) n.textContent = t; };
  // A página já tem referrer «strict-origin» (o Origin vai certo nos POST e o Referer leva só o domínio, nunca o endereço com o payload).
  // Repetido aqui por segurança, caso a meta mude.
  fetch("/api/confirm", { method:"POST", referrerPolicy:"strict-origin", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ code: code }) })
    .then(function(r){ note(r.ok ? "Enviámos-te um email com o nome, para confirmares quando quiseres." : "Não foi possível enviar o email de confirmação, mas podes voltar a este link sempre que quiseres."); })
    .catch(function(){ note("Não foi possível enviar o email de confirmação, mas podes voltar a este link sempre que quiseres."); });
}

function invalid(){
  app.innerHTML = '<div><div class="eyebrow">Link inválido</div><h1>Não encontrámos este sorteio</h1></div>'+
    '<p class="lead">Confirma que abriste o link completo que recebeste. Se o problema continuar, pede a quem organizou para te reenviar o convite.</p>'+
    '<a class="btn wide" href="/#entrar">Escrever o código</a>';
}

(function route(){
  var o = null, key = null, code = null;
  var pm = location.pathname.match(/\/r\/([A-Za-z0-9_.-]+)/);
  var h = pm ? pm[1] : (location.hash || "").replace(/^#/,"").trim();
  // Privacidade: o código sai do endereço logo ao abrir (fica só "/r"), para não ficar
  // nas estatísticas de visitas nem no histórico. Guarda-se apenas nesta aba do navegador.
  if (!h) { try { h = sessionStorage.getItem("sap-r") || ""; } catch (e) {} }
  if (h && h.indexOf(".") > 0 && history.replaceState) {
    try { sessionStorage.setItem("sap-r", h); } catch (e) {}
    try { history.replaceState(null, "", "/r"); } catch (e) {}
  }
  // Só aceitamos links assinados pelo servidor (código.assinatura); um link sem assinatura é inválido.
  if (h && h.indexOf(".") > 0){ o = Sap.safe(Sap.decode(h)); key = "sapr-" + Sap.hash(h); code = h.indexOf(".") > 0 ? h : null; }
  if (!o) return invalid();
  if (Sap.getS(key) === "1") showResult(o); else showDraw(o, key, code);
})();
</script>
</body>
</html>
